<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cakes by DT | Správa termínů</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600;1,800&family=Plus+Jakarta+Sans:wght@300;400;500;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
    :root {
        --primary: #bc9bc2;
        --primary-dark: #3a2640;
        --gold: #d4af37;
        --bg-dark: #0f0c29;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0; min-height: 100vh; font-family: 'Plus Jakarta Sans', sans-serif;
        background: linear-gradient(165deg, var(--bg-dark) 0%, #1e1422 100%);
        display: flex; align-items: center; justify-content: center; padding: 30px;
        color: white;
    }
    .card {
        width: 100%; max-width: 480px; background: rgba(255,255,255,0.04);
        border: 1px solid rgba(212,175,55,0.25); border-radius: 30px; padding: 45px 40px;
        backdrop-filter: blur(20px); box-shadow: 0 30px 60px rgba(0,0,0,0.4);
    }
    .card.wide { max-width: 620px; }
    h1 {
        font-family: 'Playfair Display', serif; font-style: italic; font-weight: 800;
        color: var(--gold); text-align: center; font-size: 26px; margin: 0 0 8px 0;
    }
    .subtitle { text-align: center; color: rgba(255,255,255,0.5); font-size: 13px; margin-bottom: 35px; }
    label { display: block; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(255,255,255,0.6); margin-bottom: 8px; font-weight: 600; }
    input[type="email"], input[type="password"], input[type="text"] {
        width: 100%; padding: 15px 18px; border-radius: 12px; margin-bottom: 20px;
        border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.05);
        color: white; font-size: 15px; font-family: inherit; outline: none; transition: 0.3s;
    }
    input:focus { border-color: var(--gold); background: rgba(255,255,255,0.08); }
    button {
        width: 100%; padding: 16px; border-radius: 14px; border: none; cursor: pointer;
        font-weight: 800; font-size: 13px; letter-spacing: 2px; text-transform: uppercase;
        background: linear-gradient(135deg, var(--gold), #b89325); color: var(--primary-dark);
        transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(212,175,55,0.3); }
    button.secondary { background: rgba(255,255,255,0.06); color: white; border: 1px solid rgba(255,255,255,0.15); }
    .error-msg { color: #ff8080; font-size: 13px; text-align: center; margin: -10px 0 18px 0; min-height: 16px; }

    .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .admin-header button { width: auto; padding: 10px 20px; font-size: 11px; }

    .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; font-weight: 700; }
    .cal-header button { width: 36px; height: 36px; padding: 0; background: rgba(255,255,255,0.06); color: var(--gold); font-size: 18px; border-radius: 10px; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 25px; }
    .cal-weekday { font-size: 10px; color: rgba(255,255,255,0.4); text-align: center; padding-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
    .cal-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 13px; border-radius: 10px; cursor: pointer; transition: 0.2s; background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.85); }
    .cal-day.disabled { color: rgba(255,255,255,0.12); cursor: default; }
    .cal-day.blocked { background: rgba(255,90,90,0.18); color: #ff8080; font-weight: 700; }
    .cal-day.blocked:hover { background: rgba(255,90,90,0.35); }
    .cal-day.available:hover { background: var(--gold); color: var(--primary-dark); font-weight: 700; }
    .cal-legend { display: flex; gap: 20px; font-size: 11px; color: rgba(255,255,255,0.5); margin-bottom: 25px; }
    .cal-legend .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
    .cal-legend .dot.free { background: rgba(255,255,255,0.3); }
    .cal-legend .dot.blocked { background: #ff5a5a; }

    .list-title { font-size: 13px; text-transform: uppercase; letter-spacing: 1.5px; color: rgba(255,255,255,0.5); margin-bottom: 12px; }
    .blocked-list { max-height: 220px; overflow-y: auto; margin-bottom: 10px; }
    .blocked-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: rgba(255,255,255,0.03); border-radius: 12px; margin-bottom: 8px; font-size: 13px; }
    .blocked-row .date { font-weight: 700; }
    .blocked-row .reason { color: rgba(255,255,255,0.5); font-size: 12px; margin-left: 10px; }
    .blocked-row button { width: auto; padding: 8px 14px; font-size: 10px; background: rgba(255,90,90,0.15); color: #ff8080; border: 1px solid rgba(255,90,90,0.3); }
    .empty-note { color: rgba(255,255,255,0.35); font-size: 13px; text-align: center; padding: 20px 0; }

    .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--gold); color: var(--primary-dark); padding: 14px 28px; border-radius: 50px; font-size: 13px; font-weight: 700; box-shadow: 0 20px 40px rgba(0,0,0,0.3); transition: transform 0.4s cubic-bezier(0.2,0.8,0.2,1); z-index: 100; }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .config-warning { background: rgba(255,90,90,0.1); border: 1px solid rgba(255,90,90,0.3); color: #ff9a9a; font-size: 12px; padding: 14px 18px; border-radius: 12px; margin-bottom: 20px; line-height: 1.5; }
</style>
</head>
<body>

<!-- PŘIHLAŠOVACÍ FORMULÁŘ -->
<div class="card" id="loginCard">
    <h1>Cakes by DT</h1>
    <p class="subtitle">Správa obsazených termínů</p>
    <div id="configWarning" class="config-warning" style="display:none;">
        Supabase ještě není nastavené — dole v kódu stránky vlož SUPABASE_URL a SUPABASE_ANON_KEY.
    </div>
    <form id="loginForm">
        <label>E-mail</label>
        <input type="email" id="loginEmail" required autocomplete="username">
        <label>Heslo</label>
        <input type="password" id="loginPassword" required autocomplete="current-password">
        <div class="error-msg" id="loginError"></div>
        <button type="submit">Přihlásit se</button>
    </form>
</div>

<!-- ADMIN PANEL (zobrazí se po přihlášení) -->
<div class="card wide" id="adminCard" style="display:none;">
    <div class="admin-header">
        <h1 style="margin:0;">Termíny</h1>
        <button type="button" class="secondary" id="logoutBtn">Odhlásit se</button>
    </div>

    <div class="cal-header">
        <button type="button" id="calPrev">&lsaquo;</button>
        <span id="calMonthLabel"></span>
        <button type="button" id="calNext">&rsaquo;</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-legend">
        <span><i class="dot free"></i>Klikni pro obsazení</span>
        <span><i class="dot blocked"></i>Obsazeno (klikni pro uvolnění)</span>
    </div>

    <div class="list-title">Aktuálně obsazené termíny</div>
    <div class="blocked-list" id="blockedList">
        <div class="empty-note">Zatím žádné obsazené termíny.</div>
    </div>
</div>

<div class="toast" id="toastMsg"></div>

<script>
// ============================================================
// NASTAVENÍ SUPABASE — vlož stejné hodnoty jako v index.html
// ============================================================
const SUPABASE_URL = "https://vlabocwezmpwnxrwxihs.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_H9egZ3Rrq5LYi02NxpvjCQ_xDXOQP4X";

let supabaseClient = null;
if (!SUPABASE_URL.includes('SEM_VLOZ') && window.supabase) {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
} else {
    document.getElementById('configWarning').style.display = 'block';
}

let blockedDates = new Map(); // iso datum -> reason
let calendarViewDate = new Date();

function showToast(msg) {
    const t = document.getElementById('toastMsg');
    t.innerText = msg;
    t.classList.add('show');
    clearTimeout(window._t);
    window._t = setTimeout(() => t.classList.remove('show'), 3000);
}

function isoDate(d) {
    const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
}

// --- PŘIHLÁŠENÍ ---
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById('loginError');
    errorEl.innerText = '';
    if (!supabaseClient) { errorEl.innerText = 'Supabase není nastavené (viz poznámka výše).'; return; }

    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;

    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) {
        errorEl.innerText = 'Nesprávný e-mail nebo heslo.';
        return;
    }
    showAdminPanel();
});

document.getElementById('logoutBtn').addEventListener('click', async () => {
    if (supabaseClient) await supabaseClient.auth.signOut();
    document.getElementById('adminCard').style.display = 'none';
    document.getElementById('loginCard').style.display = 'block';
});

async function showAdminPanel() {
    document.getElementById('loginCard').style.display = 'none';
    document.getElementById('adminCard').style.display = 'block';
    await loadBlockedDates();
    renderCalendar();
    renderList();
}

// Pokud je uživatel už přihlášený (obnovil stránku), rovnou ho pustíme dovnitř
window.addEventListener('DOMContentLoaded', async () => {
    if (!supabaseClient) return;
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) showAdminPanel();
});

// --- NAČTENÍ TERMÍNŮ ---
async function loadBlockedDates() {
    if (!supabaseClient) return;
    const { data, error } = await supabaseClient.from('blocked_dates').select('date, reason').order('date');
    if (error) { showToast('Chyba při načítání termínů.'); return; }
    blockedDates = new Map((data || []).map(row => [row.date, row.reason]));
}

// --- PŘEPÍNÁNÍ DNE (obsadit / uvolnit) ---
async function toggleDate(iso) {
    if (!supabaseClient) return;
    if (blockedDates.has(iso)) {
        const { error } = await supabaseClient.from('blocked_dates').delete().eq('date', iso);
        if (error) { showToast('Nepodařilo se termín uvolnit.'); return; }
        blockedDates.delete(iso);
        showToast(`Termín ${iso} je znovu volný.`);
    } else {
        const reason = window.prompt('Volitelná poznámka k termínu (např. jméno zákazníka) — nebo nech prázdné:', '') || null;
        const { error } = await supabaseClient.from('blocked_dates').insert({ date: iso, reason });
        if (error) { showToast('Nepodařilo se termín obsadit.'); return; }
        blockedDates.set(iso, reason);
        showToast(`Termín ${iso} byl označen jako obsazený.`);
    }
    renderCalendar();
    renderList();
}

// --- KALENDÁŘ ---
document.getElementById('calPrev').addEventListener('click', () => { calendarViewDate.setMonth(calendarViewDate.getMonth() - 1); renderCalendar(); });
document.getElementById('calNext').addEventListener('click', () => { calendarViewDate.setMonth(calendarViewDate.getMonth() + 1); renderCalendar(); });

function renderCalendar() {
    const grid = document.getElementById('calGrid');
    const label = document.getElementById('calMonthLabel');
    grid.innerHTML = '';

    const year = calendarViewDate.getFullYear();
    const month = calendarViewDate.getMonth();
    const monthNames = ['Leden','Únor','Březen','Duben','Květen','Červen','Červenec','Srpen','Září','Říjen','Listopad','Prosinec'];
    label.innerText = `${monthNames[month]} ${year}`;

    const firstDay = new Date(year, month, 1);
    const startWeekday = (firstDay.getDay() + 6) % 7;
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const today = new Date(); today.setHours(0,0,0,0);

    ['Po','Út','St','Čt','Pá','So','Ne'].forEach(d => {
        const el = document.createElement('div');
        el.className = 'cal-weekday'; el.innerText = d;
        grid.appendChild(el);
    });

    for (let i = 0; i < startWeekday; i++) grid.appendChild(document.createElement('div'));

    for (let day = 1; day <= daysInMonth; day++) {
        const dateObj = new Date(year, month, day);
        const iso = isoDate(dateObj);
        const cell = document.createElement('div');
        cell.className = 'cal-day';
        cell.innerText = day;

        const isPast = dateObj < today;
        const isBlocked = blockedDates.has(iso);

        if (isPast) {
            cell.classList.add('disabled');
        } else if (isBlocked) {
            cell.classList.add('blocked');
            cell.title = blockedDates.get(iso) ? `Obsazeno: ${blockedDates.get(iso)}` : 'Obsazeno';
            cell.addEventListener('click', () => toggleDate(iso));
        } else {
            cell.classList.add('available');
            cell.title = 'Klikni pro označení jako obsazeno';
            cell.addEventListener('click', () => toggleDate(iso));
        }
        grid.appendChild(cell);
    }
}

// --- SEZNAM OBSAZENÝCH TERMÍNŮ ---
function renderList() {
    const listEl = document.getElementById('blockedList');
    const upcoming = [...blockedDates.entries()]
        .filter(([iso]) => new Date(iso) >= new Date(new Date().toISOString().split('T')[0]))
        .sort(([a], [b]) => a.localeCompare(b));

    if (!upcoming.length) {
        listEl.innerHTML = '<div class="empty-note">Zatím žádné obsazené termíny.</div>';
        return;
    }

    listEl.innerHTML = upcoming.map(([iso, reason]) => {
        const niceDate = new Date(iso).toLocaleDateString('cs-CZ', { day: 'numeric', month: 'long', year: 'numeric' });
        return `<div class="blocked-row">
            <span><span class="date">${niceDate}</span>${reason ? `<span class="reason">${reason}</span>` : ''}</span>
            <button data-iso="${iso}" class="removeBtn">Uvolnit</button>
        </div>`;
    }).join('');

    listEl.querySelectorAll('.removeBtn').forEach(btn => {
        btn.addEventListener('click', () => toggleDate(btn.dataset.iso));
    });
}
</script>
</body>
</html>
